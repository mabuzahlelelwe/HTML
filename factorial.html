<!DOCTYPE html>
<html>

<head>
    <title>Factorial</title>
</head>

<body>
    <script>
        let n = parseInt(prompt("Enter a number:"));
        let factorial = 1;

        for (let i = 1; i <= n; i++) {
            factorial *= i;
        }

        document.write("Factorial of " + n + " = " + factorial);
    </script>
</body>

</html>
